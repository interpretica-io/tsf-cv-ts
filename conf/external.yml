repositories:
  - name: tsf_cv
    # Published (public) at https://github.com/interpretica-io/tsf-cv.git,
    # so the Builder clones it over HTTPS with no credentials - including
    # inside the Docker build container. To build an unpushed local change,
    # point url at the checkout mounted beside the suite instead (the
    # parent directory is mounted in, so an absolute path such as
    # /Users/<you>/src/midair-platform/tsf-cv resolves) and leave ref as
    # main. See README "Rebuilding here".
    url: https://github.com/interpretica-io/tsf-cv.git
    ref: main
    libs:
      - ta_cv
      - rpcs_cv
      - tapi_cv
